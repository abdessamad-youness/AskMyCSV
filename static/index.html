<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AskMyCSV — safe AI data analysis</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
  h1 { margin-bottom: 4px; } .sub { color: #555; margin-top: 0; }
  form { display: grid; gap: 12px; margin: 24px 0; }
  input, button { font-size: 16px; padding: 10px; }
  button { background: #0b5fff; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
  img { max-width: 100%; }
  .badge { display: inline-block; background: #e6f4ea; border-radius: 999px; padding: 2px 10px; font-size: 13px; }
</style>
</head>
<body>
<h1>AskMyCSV</h1>
<p class="sub">Upload a CSV, ask in plain English. An AI agent writes the code —
it runs in a locked sandbox that can touch <b>nothing</b> but your CSV.</p>

<form id="f">
  <input type="file" id="file" accept=".csv" required>
  <input type="text" id="q" placeholder="Which month had the highest sales?" required>
  <button type="submit">Ask</button>
</form>

<div id="out"></div>

<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const out = document.getElementById('out');
  out.innerHTML = '<p>Working… code is being written and run in the sandbox.</p>';
  const fd = new FormData();
  fd.append('file', document.getElementById('file').files[0]);
  fd.append('question', document.getElementById('q').value);
  const r = await fetch('/ask', { method: 'POST', body: fd });
  const d = await r.json();
  if (d.error) { out.innerHTML = '<pre>' + d.error + '</pre>'; return; }
  let h = '';
  h += '<p><span class="badge">Sandbox: ' + d.sandbox_mode + '</span> ';
  h += '<span class="badge">Code by: ' + d.code_source + '</span> ';
  h += '<span class="badge">Exit: ' + d.exit_code + '</span></p>';
  if (d.chart_png_base64) h += '<img src="data:image/png;base64,' + d.chart_png_base64 + '">';
  h += '<h3>Answer</h3><pre>' + (d.stdout || '') + (d.stderr ? '\n' + d.stderr : '') + '</pre>';
  h += '<h3>The exact code that ran</h3><pre>' + d.code.replace(/</g, '&lt;') + '</pre>';
  out.innerHTML = h;
});
</script>
</body>
</html>
